<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.username }}'s Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 pt-10">
    <main class="max-w-md mx-auto p-6 bg-white border border-gray-200 rounded-2xl shadow-sm text-center">
        
        {% if user.profile_pic %}
            <img src="{{ user.profile_pic.url }}" class="w-24 h-24 rounded-full mx-auto border-2 border-purple-500 shadow-md">
        {% else %}
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 mx-auto flex items-center justify-center text-white text-3xl font-bold">
                {{ user.username|slice:":1"|upper }}
            </div>
        {% endif %}

        <h1 class="mt-4 text-xl font-bold text-gray-800">{{ user.username }}</h1>
        <p class="text-gray-500 text-sm mt-1">{{ user.bio|default:"No bio yet." }}</p>

        {% if user != request.user %}
        <div class="mt-6">
            <a href="{% url 'start_chat' user.id %}" class="inline-flex items-center px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-semibold text-sm transition-all shadow-md">
                <i class="fa-solid fa-envelope mr-2"></i> Message
            </a>
        </div>
        {% endif %}

    </main>
</body>
</html>
