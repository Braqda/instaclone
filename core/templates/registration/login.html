<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to InstaClone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col justify-center items-center px-4 py-12">

    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg p-8 shadow-sm space-y-6">
        
        <div class="text-center">
            <h1 class="text-3xl font-bold tracking-tight italic text-transparent bg-clip-text bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-500 mb-2">
                InstaClone
            </h1>
            <p class="text-sm text-gray-500">Log in to see photos from your crew</p>
        </div>

        <form action="{% url 'login' %}" method="post" class="space-y-4 data-form">
            {% csrf_token %}
            
            <div class="text-sm space-y-3 [&_p]:flex [&_p]:flex-col [&_p]:gap-1 [&_label]:font-medium [&_label]:text-gray-700 [&_input]:w-full [&_input]:px-3 [&_input]:py-2 [&_input]:border [&_input]:border-gray-200 [&_input]:rounded-md [&_input]:bg-gray-50 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-pink-500 [&_input]:focus:bg-white [&_input]:transition-all">
                {{ form.as_p }}
            </div>

            <button type="submit" 
                class="w-full py-2 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold rounded-md text-sm shadow hover:opacity-90 transition-opacity cursor-pointer mt-2">
                Log In
            </button>
        </form>
    </div>

    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg p-4 text-center shadow-sm mt-4 text-sm text-gray-600">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="text-pink-600 font-semibold hover:underline ml-1">Sign Up Here</a>
    </div>

</body>
</html>
