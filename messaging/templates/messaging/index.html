<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-md mx-auto">
        <h2 class="text-xl font-bold mb-4">Your Chats</h2>
        <div class="space-y-2">
            {% for room in request.user.chat_rooms.all %}
                <a href="{% url 'chat_room' room.id %}" class="block p-4 bg-white rounded-xl shadow-sm border border-gray-200">
                    Chat with {{ room.participants.exclude.username }}
                </a>
            {% empty %}
                <p class="text-gray-500">No active chats.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
