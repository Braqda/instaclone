<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-lg mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-bold mb-4">Chat Room</h2>
        
        <div class="h-64 overflow-y-scroll border-b border-gray-200 mb-4 space-y-2">
            {% for message in room.messages.all %}
                <div class="p-2 {% if message.sender == request.user %}bg-purple-100 text-right{% else %}bg-gray-100{% endif %} rounded-lg">
                    <p class="text-xs text-gray-500">{{ message.sender.username }}</p>
                    <p class="text-sm">{{ message.text }}</p>
                </div>
            {% endfor %}
        </div>

        <form method="POST" class="flex gap-2">
            {% csrf_token %}
            <input type="text" name="text" class="flex-1 border rounded-lg p-2" placeholder="Type a message..." required>
            <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg">Send</button>
        </form>
    </div>
</body>
</html>
